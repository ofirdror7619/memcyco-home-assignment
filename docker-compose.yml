services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DB_URL: "jdbc:h2:file:/app/data/scheduling;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_PROFILES_ACTIVE: local
    volumes:
      - h2-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  h2-data:
